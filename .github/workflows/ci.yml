name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: ./scripts/test.sh
      # The client ID is public (Device Flow has no secret), so a repository
      # variable is enough; without it the build can't sign anyone in.
      - run: ./scripts/bundle.sh
        env:
          PULLOVER_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: Pullover
          path: dist/Pullover-*.zip
