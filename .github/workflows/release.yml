name: Release

# The whole release happens in CI — locally you only push a tag:
#   git tag v0.1.1 && git push origin v0.1.1
# The `build` job builds one universal dmg (Apple Silicon + Intel), signs it
# with a Developer ID certificate, has Apple notarize it, and attaches it to
# a draft GitHub release (electron-builder's publisher, see the `publish`
# section of electron-builder.yml). The `publish` job then runs Claude, which
# writes user-facing release notes from the commit log, verifies the assets,
# and publishes the draft.
#
# Repository configuration — Settings → Secrets and variables → Actions:
#   Variables
#   - PULLOVER_GITHUB_CLIENT_ID — the client ID of the official Pullover
#     OAuth App (a Device Flow public client; the client ID is not a secret).
#     It is baked into the build so released binaries can sign in out of the box.
#   Secrets
#   - ANTHROPIC_API_KEY      — for the release-notes step.
#   - CSC_LINK               — Developer ID Application cert, .p12 as base64
#                              (`base64 -i Certificates.p12`). Export it from
#                              Keychain Access with the private key included.
#   - CSC_KEY_PASSWORD       — the password that .p12 was exported with.
#   - APPLE_API_KEY_CONTENT  — an App Store Connect API key (.p8), verbatim.
#                              Apple allows downloading it exactly once.
#   - APPLE_API_KEY_ID       — that key's ID.
#   - APPLE_API_ISSUER       — the issuer UUID it belongs to.
# Only the account holder can issue the certificate, so only they can cut a
# release; a fork's CI will fail this job's secret check, which is correct.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Ensure the OAuth client ID is configured
        if: ${{ vars.PULLOVER_GITHUB_CLIENT_ID == '' }}
        run: |
          echo "::error::Set the PULLOVER_GITHUB_CLIENT_ID repository variable (Settings → Secrets and variables → Actions → Variables) to the client ID of the official Pullover OAuth App."
          exit 1

      - run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}

      # electron-builder skips notarization with only a warning when the
      # credentials are absent, so a missing secret would quietly ship an
      # un-notarized build. Fail loudly here instead.
      - name: Ensure the signing and notarization secrets are configured
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — signing needs CSC_LINK (Developer ID .p12 as base64), CSC_KEY_PASSWORD, and an App Store Connect key as APPLE_API_KEY_CONTENT + APPLE_API_KEY_ID + APPLE_API_ISSUER. See the header of this file."
            exit 1
          fi

      # @electron/notarize takes APPLE_API_KEY as a path to the .p8, not its
      # contents, so the secret is written to a file the runner discards.
      - name: Stage the App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Build the universal dmg and zip, and attach them to a draft release
        run: npx electron-builder --mac dmg zip --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate, as base64 of the .p12.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # App Store Connect API key. Preferred over APPLE_ID +
          # APPLE_APP_SPECIFIC_PASSWORD: it is scoped, revocable, and not
          # tied to a personal Apple ID. Note electron-builder checks
          # APPLE_ID first, so those two must stay unset for this to be used.
          APPLE_API_KEY: ${{ runner.temp }}/asc-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Proves the app users end up running is really signed and notarized,
      # rather than trusting that the build step did it. The checks target the
      # .app, not the dmg: electron-builder notarizes and staples the app and
      # then packages the stapled copy into an unsigned disk image, which is
      # deliberate — `dmg.sign` defaults to false because, in its own words,
      # signing the image "will lead to unwanted errors in combination with
      # notarization requirements". The ticket travels with the app, so the
      # app is what Gatekeeper judges on first launch.
      - name: Verify the app is signed, notarized and stapled
        run: |
          app=$(ls -d dist/mac-universal/*.app)
          echo "Checking $app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Must report `source=Notarized Developer ID`; anything else means
          # the build produced something Gatekeeper would still block.
          spctl --assess --type execute -vv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure ANTHROPIC_API_KEY is configured
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret — the publish job uses Claude to write the release notes. The draft release with the dmg, the zip and latest-mac.yml is ready; you can also write notes and publish it by hand."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for the changelog

      # Claude Code CLI directly, not anthropics/claude-code-action — the
      # action refuses tag pushes ("Unsupported event type: push").
      - name: Write release notes and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          # Prompt on stdin, not as a trailing argument: `--allowedTools` takes
          # a variadic <tools...>, so it swallowed the prompt that followed it
          # and the v0.2.0 run died with "Input must be provided either through
          # stdin or as a prompt argument". stdin sidesteps the ambiguity.
          claude -p --allowedTools 'Bash(git:*),Bash(gh:*),Write' <<'PROMPT'
          You are running inside GitHub Actions — the `publish` job of Pullover's release workflow, non-interactive, nobody to ask questions. Your only task is to finish the release for tag ${{ github.ref_name }}.

          Ignore the release playbook in AGENTS.md — it is for the local agent, and its part is already done: the version is bumped, the tag is pushed, and the build job has attached the dmg to a DRAFT GitHub release for this tag. You are the CI half. Your job:

          1. List every release for this tag: `gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | {id, draft, assets: [.assets[].name]}'`. electron-builder sometimes races itself and leaves TWO drafts for the same tag with the assets split between them. If that happened, consolidate: for each stray asset, download it (`gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/<asset-id> > <name>`) and re-upload it to the draft that holds the dmg (`curl -sS -f -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @<name> "https://uploads.github.com/repos/${{ github.repository }}/releases/<id>/assets?name=<name>"`), then delete the now-empty extra draft (`gh api -X DELETE repos/${{ github.repository }}/releases/<id>`).
          2. Verify the single remaining draft holds all three of `Pullover-<version>.dmg` (what people download), `Pullover-<version>.zip` and `latest-mac.yml` (what the auto-updater reads — without them installed copies will never see this release). One universal build, no arch suffix. If any is missing, print what's wrong and exit with `exit 1` — do NOT publish a broken release.
          3. Write user-facing release notes from the commits since the previous tag: find it with `git describe --tags --abbrev=0 ${{ github.ref_name }}^` (if the command fails, this is the first release — write a 2-3 sentence introduction of the app from README.md instead of a changelog). Notes style: a flat bullet list, no headings. One bullet per user-visible change, present tense, no commit hashes, and skip internal refactors, CI and docs work nobody can feel — if a change does not alter what someone sees or does, leave it out.

          Write each bullet as: an emoji, then the change named in bold, then a sentence saying what it means for the person using the app. For example: `- 🔔 **Mentions** — a pull request that mentions you now shows up even when you are not a reviewer.` Pick each emoji for that specific change rather than repeating one down the list, and use at most one per bullet. Lead with the change people will care about most.

          Two things override the cheerfulness. Anything that loses data, signs the user out, resets settings or otherwise requires action gets ⚠️ and says plainly what will happen — that bullet goes first, whatever else is in the release. And a fix is described by what stopped being broken, not by praising the fix.

          Do not invent significance. A small release stays a short list; padding two bug fixes into a triumphant announcement reads as noise, and the next release then has to shout louder to compete.
          4. Publish: write the notes to a file and run `gh release edit ${{ github.ref_name }} --title '${{ github.ref_name }}' --notes-file <file> --draft=false`. Passing `--title` is not optional: electron-builder names the draft after the version (`0.3.0`) rather than the tag (`v0.3.0`), so without it every release is titled inconsistently with the others and has to be renamed by hand.
          PROMPT

      - name: Verify the release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::The release is still a draft — Claude did not publish it. Check the step above; the artifacts are attached, so you can publish it by hand."
            exit 1
          fi
