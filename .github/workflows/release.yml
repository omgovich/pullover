name: Release

# Releases follow the changesets in .changeset/ (see its README). On every push to main:
# - pending changesets → the `version` job opens or updates a "Release vX.Y.Z" PR
#   that bumps package.json and writes CHANGELOG.md;
# - a package.json version with no `v<version>` tag yet, which is what merging that PR
#   leaves → the `build` job builds one universal dmg (Apple Silicon + Intel), signs
#   it with a Developer ID certificate, has Apple notarize it, and attaches it to a
#   draft GitHub release (electron-builder's publisher, see the `publish` section of
#   electron-builder.yml). The `publish` job then checks the assets, tags the commit
#   and publishes the draft with that version's CHANGELOG.md section as its notes.
# The tag is created last, so a run that fails anywhere before it is retried by the
# next push to main, or by running this workflow by hand.
#
# Repository configuration — Settings → Secrets and variables → Actions:
#   Variables
#   - PULLOVER_GITHUB_CLIENT_ID — the client ID of the official Pullover
#     OAuth App (a Device Flow public client; the client ID is not a secret).
#     It is baked into the build so released binaries can sign in out of the box.
#   Secrets
#   - CSC_LINK               — Developer ID Application cert, .p12 as base64
#                              (`base64 -i Certificates.p12`). Export it from
#                              Keychain Access with the private key included.
#   - CSC_KEY_PASSWORD       — the password that .p12 was exported with.
#   - APPLE_API_KEY_CONTENT  — an App Store Connect API key (.p8), verbatim.
#                              Apple allows downloading it exactly once.
#   - APPLE_API_KEY_ID       — that key's ID.
#   - APPLE_API_ISSUER       — the issuer UUID it belongs to.
# Settings → Actions → General must allow GitHub Actions to create pull requests,
# or the `version` job cannot open the Release PR.
# Only the account holder can issue the certificate, so only they can cut a
# release; a fork's CI will fail the build's secret check, which is correct.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued, never cancelled: a second push while a release builds must wait for its
# tag, or it would build the same version again.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ls .changeset/*.md | grep -v README.md > /dev/null; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  version:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: next
        run: |
          npx changeset status --output "$RUNNER_TEMP/status.json"
          echo "version=$(node -p "require('$RUNNER_TEMP/status.json').releases[0].newVersion")" >> "$GITHUB_OUTPUT"
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run changeset:version
          commit-message: Release v${{ steps.next.outputs.version }}
          pr-title: Release v${{ steps.next.outputs.version }}

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # Pinned, not `macos-latest`. electron-builder creates its signing
    # keychain with a random password but calls `security
    # set-key-partition-list` with the *certificate's* password instead; the
    # macOS 26 image that rolled out on 2026-08-28 started rejecting that, so
    # signing fails with "SecKeychainUnlock: The user name or passphrase you
    # entered is not correct". Fixed upstream in 27.0.0-alpha.6 and not
    # backported — unpin once a stable release carries it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm test` includes the screenshot tests, which drive a real Chromium.
      # Same cache key as ci.yml, and the same runner OS, so this usually
      # restores what the CI run on this very commit already downloaded.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - run: npm run typecheck
      - run: npm test

      - name: Ensure the OAuth client ID is configured
        if: ${{ vars.PULLOVER_GITHUB_CLIENT_ID == '' }}
        run: |
          echo "::error::Set the PULLOVER_GITHUB_CLIENT_ID repository variable (Settings → Secrets and variables → Actions → Variables) to the client ID of the official Pullover OAuth App."
          exit 1

      - run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}

      # electron-builder skips notarization with only a warning when the
      # credentials are absent, so a missing secret would quietly ship an
      # un-notarized build. Fail loudly here instead.
      - name: Ensure the signing and notarization secrets are configured
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — signing needs CSC_LINK (Developer ID .p12 as base64), CSC_KEY_PASSWORD, and an App Store Connect key as APPLE_API_KEY_CONTENT + APPLE_API_KEY_ID + APPLE_API_ISSUER. See the header of this file."
            exit 1
          fi

      # @electron/notarize takes APPLE_API_KEY as a path to the .p8, not its
      # contents, so the secret is written to a file the runner discards.
      - name: Stage the App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/asc-api-key.p8"

      - name: Build the universal dmg and zip, and attach them to a draft release
        run: npx electron-builder --mac dmg zip --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate, as base64 of the .p12.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # App Store Connect API key. Preferred over APPLE_ID +
          # APPLE_APP_SPECIFIC_PASSWORD: it is scoped, revocable, and not
          # tied to a personal Apple ID. Note electron-builder checks
          # APPLE_ID first, so those two must stay unset for this to be used.
          APPLE_API_KEY: ${{ runner.temp }}/asc-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Proves the app users end up running is really signed and notarized,
      # rather than trusting that the build step did it. The checks target the
      # .app, not the dmg: electron-builder notarizes and staples the app and
      # then packages the stapled copy into an unsigned disk image, which is
      # deliberate — `dmg.sign` defaults to false because, in its own words,
      # signing the image "will lead to unwanted errors in combination with
      # notarization requirements". The ticket travels with the app, so the
      # app is what Gatekeeper judges on first launch.
      - name: Verify the app is signed, notarized and stapled
        run: |
          app=$(ls -d dist/mac-universal/*.app)
          echo "Checking $app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Must report `source=Notarized Developer ID`; anything else means
          # the build produced something Gatekeeper would still block.
          spctl --assess --type execute -vv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # electron-builder sometimes races itself and leaves two drafts for one tag,
      # with the assets split between them. Move everything into the draft that
      # holds the dmg and delete the rest.
      - name: Merge duplicate drafts
        run: |
          drafts=$(gh api "repos/$REPO/releases" --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)]")
          keeper=$(jq -r --arg dmg "Pullover-$VERSION.dmg" '[.[] | select(any(.assets[]; .name == $dmg))][0].id // empty' <<< "$drafts")
          if [ -z "$keeper" ]; then
            echo "::error::No draft release for $TAG holds Pullover-$VERSION.dmg."
            exit 1
          fi
          kept=$(jq -r --argjson id "$keeper" '.[] | select(.id == $id) | .assets[].name' <<< "$drafts")
          for id in $(jq -r --argjson id "$keeper" '.[] | select(.id != $id) | .id' <<< "$drafts"); do
            jq -c --argjson id "$id" '.[] | select(.id == $id) | .assets[]' <<< "$drafts" | while read -r asset; do
              name=$(jq -r .name <<< "$asset")
              grep -qxF "$name" <<< "$kept" && continue
              gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$(jq -r .id <<< "$asset")" > "$RUNNER_TEMP/$name"
              curl -sS -f -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                --data-binary "@$RUNNER_TEMP/$name" \
                "https://uploads.github.com/repos/$REPO/releases/$keeper/assets?name=$name" > /dev/null
            done
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          echo "RELEASE_ID=$keeper" >> "$GITHUB_ENV"

      # The dmg is what people download; the zip, its blockmap and latest-mac.yml are
      # what the auto-updater reads, so without them installed copies never see this
      # release. A .dmg.blockmap means `dmg.writeUpdateInfo` was turned back on.
      - name: Verify the assets
        run: |
          assets=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.assets[].name')
          echo "$assets"
          for name in "Pullover-$VERSION.dmg" "Pullover-$VERSION.zip" "Pullover-$VERSION.zip.blockmap" latest-mac.yml; do
            grep -qxF "$name" <<< "$assets" || { echo "::error::$name is missing from the draft."; exit 1; }
          done
          if grep -q '\.dmg\.blockmap$' <<< "$assets"; then
            echo "::error::The draft carries a .dmg.blockmap that nothing reads."
            exit 1
          fi

      # Changesets groups each version under "### Minor Changes" and "### Patch
      # Changes"; the notes are one flat list.
      - name: Write the notes
        run: |
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on && NF && !/^### /' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION."
            exit 1
          fi

      # The draft names itself after the version (`0.3.0`), not the tag, so the
      # title is set here. The tag goes on the commit that was built.
      - name: Tag the commit and publish the release
        run: |
          # A re-run after this step already tagged finds the tag in place.
          gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null \
            || [ "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA" ]
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA" -f "name=$TAG" \
            -F "body=@$RUNNER_TEMP/notes.md" -F draft=false > /dev/null
          gh release view "$TAG" --repo "$REPO" --json url,isDraft --jq '"\(.url) draft=\(.isDraft)"'
