name: Release

# The whole release happens in CI — locally you only push a tag:
#   git tag v0.1.1 && git push origin v0.1.1
# The `build` job builds one unsigned universal dmg (Apple Silicon +
# Intel) and attaches it to a draft GitHub release (electron-builder's publisher, see the `publish`
# section of electron-builder.yml). The `publish` job then runs Claude,
# which writes user-facing release notes from the commit log, verifies the
# assets, and publishes the draft.
#
# Needs two pieces of repository configuration:
#   Settings → Secrets and variables → Actions →
#   - Variables → PULLOVER_GITHUB_CLIENT_ID — the client ID of the official
#     Pullover OAuth App (a Device Flow public client; the client ID is not
#     a secret). It is baked into the build so released binaries can sign
#     in out of the box.
#   - Secrets → ANTHROPIC_API_KEY — for the release-notes step.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Ensure the OAuth client ID is configured
        if: ${{ vars.PULLOVER_GITHUB_CLIENT_ID == '' }}
        run: |
          echo "::error::Set the PULLOVER_GITHUB_CLIENT_ID repository variable (Settings → Secrets and variables → Actions → Variables) to the client ID of the official Pullover OAuth App."
          exit 1

      - run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.PULLOVER_GITHUB_CLIENT_ID }}

      # Unsigned for now. To sign + notarize once an Apple Developer
      # account exists, follow the comment in electron-builder.yml and add
      # these env vars here (all from repository secrets):
      #   CSC_LINK, CSC_KEY_PASSWORD           — Developer ID cert (.p12, base64)
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — notarization
      - name: Build the universal dmg and attach it to a draft release
        run: npx electron-builder --mac dmg --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure ANTHROPIC_API_KEY is configured
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret — the publish job uses Claude to write the release notes. The draft release with the dmgs is ready; you can also write notes and publish it by hand."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for the changelog

      # Claude Code CLI directly, not anthropics/claude-code-action — the
      # action refuses tag pushes ("Unsupported event type: push").
      - name: Write release notes and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p \
            --allowedTools 'Bash(git:*),Bash(gh:*),Write' \
            "$(cat <<'PROMPT'
          You are running inside GitHub Actions — the `publish` job of Pullover's release workflow, non-interactive, nobody to ask questions. Your only task is to finish the release for tag ${{ github.ref_name }}.

          Ignore the release playbook in AGENTS.md — it is for the local agent, and its part is already done: the version is bumped, the tag is pushed, and the build job has attached the dmg to a DRAFT GitHub release for this tag. You are the CI half. Your job:

          1. List every release for this tag: `gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | {id, draft, assets: [.assets[].name]}'`. electron-builder sometimes races itself and leaves TWO drafts for the same tag with the assets split between them. If that happened, consolidate: for each stray asset, download it (`gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/<asset-id> > <name>`) and re-upload it to the draft that holds the dmgs (`curl -sS -f -X POST -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @<name> "https://uploads.github.com/repos/${{ github.repository }}/releases/<id>/assets?name=<name>"`), then delete the now-empty extra draft (`gh api -X DELETE repos/${{ github.repository }}/releases/<id>`).
          2. Verify the single remaining draft holds `Pullover-<version>.dmg` — one universal build, no arch suffix. If it's missing, print what's wrong and exit with `exit 1` — do NOT publish a broken release.
          3. Write user-facing release notes from the commits since the previous tag: find it with `git describe --tags --abbrev=0 ${{ github.ref_name }}^` (if the command fails, this is the first release — write a 2-3 sentence introduction of the app from README.md instead of a changelog). Notes style: a flat bullet list, no headings — one short bullet per user-visible change, present tense, no commit hashes, skip internal refactors/CI/docs changes users can't feel.
          4. Publish: write the notes to a file and run `gh release edit ${{ github.ref_name }} --notes-file <file> --draft=false`.
          PROMPT
          )"

      - name: Verify the release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::error::The release is still a draft — Claude did not publish it. Check the step above; the dmgs are attached, so you can publish it by hand."
            exit 1
          fi
