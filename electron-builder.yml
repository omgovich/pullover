appId: ru.omgovich.pullover
productName: Pullover
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
dmg:
  # The app has no auto-update (no electron-updater), so don't generate the
  # update artifacts (*.blockmap, latest-mac.yml) — releases stay just the
  # dmgs. Flip back to true if auto-update ever lands.
  writeUpdateInfo: false
publish:
  provider: github
  owner: omgovich
  repo: pullover
  # The release workflow runs `electron-builder --publish always`, which
  # makes electron-builder itself create the GitHub release for the pushed
  # tag and upload the dmgs into it — as a draft, per this setting.
  releaseType: draft
mac:
  target:
    - dmg
    - dir
  # Releases ship one universal dmg (see release.yml), so no arch suffix.
  artifactName: ${productName}-${version}.${ext}
  category: public.app-category.developer-tools
  # A menu-bar-only app: no Dock icon, no app switcher entry.
  extendInfo:
    LSUIElement: true
  # Signed with a Developer ID Application certificate and notarized by
  # Apple, so Gatekeeper opens the app without the "unidentified developer"
  # warning. The release workflow supplies the credentials; see the comment
  # above its signing step for which secrets those are.
  #
  # `notarize: true` is not a safety net: when the credentials are missing
  # electron-builder logs a warning and carries on, producing a signed but
  # un-notarized build. release.yml therefore checks the secrets before the
  # build and staples/validates the result afterwards.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
